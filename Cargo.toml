[workspace]
resolver = "2"
# firmware/esp32c3 is built on its own for riscv32imc-unknown-none-elf (docs/bridge-hardware.md).
exclude = ["firmware"]
members = [
    "crates/kline-spec",
    "crates/kline-core",
    "crates/kline-sim",
    "crates/kline-host",
    "crates/kline-cli",
    "crates/kline-agent",
    "crates/kline-bridge",
]

[workspace.package]
edition = "2021"
publish = false
license = "GPL-3.0-or-later"
authors = ["Natanael Feješ"]
