[package]
name = "kline-agent"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
description = "`kline-agent`: read-only K-line tool for AI use. Tier 0 reads plus `prepare` (risk + the exact human `kline exec` command). Built without approved-routines."

[[bin]]
name = "kline-agent"
path = "src/main.rs"

[dependencies]
# Never add kline-cli or kline-core's `approved-routines` here (tests/no_approvals.rs checks).
kline-host = { path = "../kline-host" }
kline-core = { path = "../kline-core", features = ["spec"] }
anyhow = "1.0.100"
clap = { version = "4.6.9", features = ["derive"] }
ctrlc = { version = "3.5.3", features = ["termination"] }
serde_json = "1.0.154"

[dev-dependencies]
kline-sim = { path = "../kline-sim" }
kline-spec = { path = "../kline-spec" }
