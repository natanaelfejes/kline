[package]
name = "kline-sim"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
description = "ECU simulator for end-to-end tests: K-line bus with echo and wake-up detection, spec-driven ECUs, replay, in-process and pty transports."

[features]
# Forwards kline-core's `approved-routines` (SAFETY.md rule 2): `Driver::request_approved` and the
# approval tests. Off by default; only kline-cli turns it on.
approved-routines = ["kline-core/approved-routines"]

[dependencies]
kline-core = { path = "../kline-core" }
kline-spec = { path = "../kline-spec" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30.1", features = ["term", "fs"] }

[dev-dependencies]
kline-core = { path = "../kline-core", features = ["spec"] }
serialport = { version = "4.10.1", default-features = false }
