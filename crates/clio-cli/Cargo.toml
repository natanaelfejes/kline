[package]
name = "clio-cli"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "`clio`: interactive K-line diagnostic CLI for the Clio II (FTDI KKL cable). The only crate that enables approvals."

[[bin]]
name = "clio"
path = "src/main.rs"

[dependencies]
clio-host = { path = "../clio-host" }
# SAFETY.md rule 2: the interactive `clio` CLI is the only binary that may enable approvals.
clio-core = { path = "../clio-core", features = ["spec", "approved-routines"] }
clio-spec = { path = "../clio-spec" }
anyhow = "1.0.100"
clap = { version = "4.6.9", features = ["derive"] }
ctrlc = "3.5.3"
serde_json = "1.0.154"

[dev-dependencies]
clio-sim = { path = "../clio-sim" }
serialport = { version = "4.10.1", default-features = false }
