[package]
name = "clio-sim"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "ECU simulator for end-to-end tests: K-line bus with echo and wake-up detection, spec-driven ECUs, replay, in-process and pty transports."

[features]
# Forwards clio-core's `approved-routines` (SAFETY.md rule 2): `Driver::request_approved` and the
# approval tests. Off by default; only clio-cli turns it on.
approved-routines = ["clio-core/approved-routines"]

[dependencies]
clio-core = { path = "../clio-core" }
clio-spec = { path = "../clio-spec" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30.1", features = ["term", "fs"] }

[dev-dependencies]
clio-core = { path = "../clio-core", features = ["spec"] }
serialport = { version = "4.10.1", default-features = false }
