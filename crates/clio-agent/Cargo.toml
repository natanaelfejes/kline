[package]
name = "clio-agent"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "`clio-agent`: read-only K-line tool for AI use. Tier 0 reads plus `prepare` (risk + the exact human `clio exec` command). Built without approved-routines."

[[bin]]
name = "clio-agent"
path = "src/main.rs"

[dependencies]
# Never add clio-cli or clio-core's `approved-routines` here (tests/no_approvals.rs checks).
clio-host = { path = "../clio-host" }
clio-core = { path = "../clio-core", features = ["spec"] }
anyhow = "1.0.100"
clap = { version = "4.6.9", features = ["derive"] }
ctrlc = "3.5.3"
serde_json = "1.0.154"

[dev-dependencies]
clio-sim = { path = "../clio-sim" }
clio-spec = { path = "../clio-spec" }
