[package]
name = "kline-host"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
description = "Host-side runtime shared by `kline` and `kline-agent`: serial/sim transports, link runner, JSONL capture, trace, Tier 0 commands. Never enables kline-core's approved-routines."

[features]
# `--transport ble`: reads through the Clio Link bridge (docs/bridge-protocol.md). kline-bridge
# is used without default features plus `std`: never its `approvals`.
ble = ["dep:kline-bridge"]

[dependencies]
kline-bridge = { path = "../kline-bridge", default-features = false, features = ["std"], optional = true }
# No `approved-routines` here, ever (SAFETY.md rule 2): kline-agent depends on this crate.
kline-core = { path = "../kline-core", features = ["spec"] }
kline-spec = { path = "../kline-spec" }
clap = { version = "4.6.9", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serialport = { version = "4.10.1", default-features = false }

# Same nix as serialport 4.10.1 uses; termios only, to clear IGNBRK after open (safe API).
[target.'cfg(unix)'.dependencies]
nix = { version = "0.26", default-features = false, features = ["term"] }

[dev-dependencies]
kline-sim = { path = "../kline-sim" }
kline-bridge = { path = "../kline-bridge", default-features = false, features = ["std"] }
