[package]
name = "kline-core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
description = "Sans-IO K-line protocol engine (5-baud/fast init, ISO8/KWP2000 framing) and safety policy. no_std + alloc."

[features]
default = ["std"]
std = ["thiserror/std"]
# EcuDef/KLine -> LinkConfig mapping. Pulls kline-spec (std only).
spec = ["std", "dep:kline-spec"]
# Tier 1/2 approvals (SAFETY.md rule 2). OFF by default. Only the interactive `kline` CLI and
# the bridge firmware (kline-bridge `approvals`) may enable it; MCP servers and any
# --json-only binary must never depend on kline-core with it. No `std`: the firmware is no_std
# and provides the random source through getrandom's custom backend.
approved-routines = ["dep:getrandom"]

[dependencies]
thiserror = { version = "2.0.21", default-features = false }
kline-spec = { path = "../kline-spec", optional = true }
getrandom = { version = "0.4.3", optional = true }

[dev-dependencies]
proptest = "1.12.0"
