[package]
name = "clio-core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Sans-IO K-line protocol engine (5-baud/fast init, ISO8/KWP2000 framing) and safety policy. no_std + alloc."

[features]
default = ["std"]
std = ["thiserror/std"]
# EcuDef/KLine -> LinkConfig mapping. Pulls clio-spec (std only).
spec = ["std", "dep:clio-spec"]
# Tier 1/2 approvals (SAFETY.md rule 2). OFF by default. Only the interactive `clio` CLI may
# enable it; MCP servers and any --json-only binary must never depend on clio-core with it.
approved-routines = ["std", "dep:getrandom"]

[dependencies]
thiserror = { version = "2.0.21", default-features = false }
clio-spec = { path = "../clio-spec", optional = true }
getrandom = { version = "0.4.3", optional = true }

[dev-dependencies]
proptest = "1.12.0"
