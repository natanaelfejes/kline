[package]
name = "clio-host"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Host-side runtime shared by `clio` and `clio-agent`: serial/sim transports, link runner, JSONL capture, trace, Tier 0 commands. Never enables clio-core's approved-routines."

[dependencies]
# No `approved-routines` here, ever (SAFETY.md rule 2): clio-agent depends on this crate.
clio-core = { path = "../clio-core", features = ["spec"] }
clio-spec = { path = "../clio-spec" }
clap = { version = "4.6.9", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serialport = { version = "4.10.1", default-features = false }

[dev-dependencies]
clio-sim = { path = "../clio-sim" }
